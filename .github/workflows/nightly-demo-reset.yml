name: Nightly demo reset

on:
  schedule:
    - cron: "0 1 * * *" # 02:00 in Lagos (UTC+1)
  workflow_dispatch:

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Rebuild the demo database
        env:
          # Session pooler URL (port 5432): GitHub runners have no IPv6.
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase/scripts/reset-demo.sh
